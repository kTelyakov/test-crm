services:
  backend:
    image: ghcr.io/ktelyakov/test-crm-backend:latest
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      FRONTEND_ORIGIN: https://${SITE_HOST}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/ktelyakov/test-crm-web:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_HOST: ${SITE_HOST}
      API_HOST: ${API_HOST}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
